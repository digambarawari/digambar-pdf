<div class="flex justify-center bg-gray-50">
  <div class="w-full max-w-md rounded-lg bg-white p-6 shadow">
    <h1 class="mb-6 text-center text-2xl font-semibold">Login</h1>
    <p *ngIf="error" class="mb-4 text-red-500 text-center"> {{ error }} </p>
    <form (submit)="submit($event);" class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-medium">Email</label>
        <input
          type="email"
          placeholder="Email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          class="w-full rounded-md border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <p *ngIf="emailError()" class="text-red-500 text-sm mt-1">
          {{ emailError() }}
        </p>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium">Password</label>
        <input
          type="password"
          placeholder="Password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          (blur)="touched.set({ ...touched(), password: true })"
          class="w-full rounded-md border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <p *ngIf="passwordError()" class="text-red-500 text-sm mt-1">
          {{ passwordError() }}
        </p>
      </div>

      <button
        type="submit"
        [disabled]="!isValid() || loading()"
        class="w-full rounded-md bg-blue-600 py-2 text-white hover:bg-blue-700 disabled:opacity-50">
        {{ loading() ? 'Logging in…' : 'Login' }}
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Don't have an account?
      <a routerLink="/signup" class="text-blue-600 hover:underline">Sign up</a>
    </p>
  </div>
</div>
