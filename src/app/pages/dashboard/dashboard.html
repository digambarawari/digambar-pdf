<div class="bg-white border-b shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">

    <!-- Left: Logo -->
    <div class="flex items-center gap-2">
      
      <span class="font-semibold text-lg">PDF list</span>
    </div>

    <!-- Center: Search -->
    <div class="flex-1 mx-6 max-w-md">
      <div class="relative">
        <input
          type="text"
          placeholder="Search PDFs..."
          class="w-full border rounded-lg pl-10 pr-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
        <span class="absolute left-3 top-2.5 text-gray-400">
          🔍
        </span>
      </div>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-4">
      <button routerLink="/uploadpdf" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        Upload
      </button>
    </div>

  </div>
</div>
<div *ngIf="pdfService.pdfListDetails().length > 0; else noPdfs" class="mx-auto mt-6 space-y-4">
    <div *ngFor="let item of pdfService.pdfListDetails()"
        class="p-4 bg-white rounded shadow-md">
    <h3 class="text-xl font-bold">{{ item.title }} ({{ item.rating }}/5)</h3>
    <p class="text-gray-700">{{ item.description }}</p>
    <p class="text-sm text-gray-500">Author: {{ item.author.name }} | Tags: {{ getTagNames(item.tags) }}</p>
    <a routerLink="/viewpdf" (click)="setPdfUrl(item.assets[0].url, item.title)" class="text-blue-500 hover:underline mt-2 inline-block">View PDF</a>
    </div>
</div>
<ng-template #noPdfs>
  <div class="mx-auto mt-6 space-y-4">
    <p class="text-sm text-gray-500">No PDF available. please upload pdf</p>
  </div>
  
</ng-template>
