<div class="max-w-lg mx-auto p-6 bg-white rounded shadow-md space-y-4 relative">
    <h2 class="text-2xl font-bold mb-4">Update PDF</h2>
    <button routerLink="/dashboard" class="absolute top-2.5 right-6 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        Back to Dashboard
    </button>
    <form (submit)="onPdfSubmit($event);" class="space-y-4">
        <p *ngIf="error()" class="mb-4 text-red-500 text-center"> {{ error() }} </p>
        <!-- Title -->
        <div>
            <label class="block font-medium mb-1">Title<span class="text-red-500">*</span></label>
            <input type="text" [value]="title()" (input)="onFieldInputChange($event, 'title')" placeholder="Enter title"
                    class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500" />
            <p *ngIf="touched.title() && titleError()" class="text-red-500 text-sm mt-1">{{ titleError() }}</p>
        </div>

        <!-- Description -->
        <div>
            <label class="block font-medium mb-1">Description<span class="text-red-500">*</span></label>
            <textarea [value]="description()" (input)="onFieldInputChange($event, 'description')" placeholder="Enter description"
                        class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500"></textarea>
            <p *ngIf="touched.description() && descriptionError()" class="text-red-500 text-sm mt-1">{{ descriptionError() }}</p>
        </div>

        <!-- Rating -->
        <div>
            <label class="block font-medium mb-1">Rating (1-5)<span class="text-red-500">*</span></label>
            <input type="number" [value]="rating()" (input)="onFieldInputChange($event, 'rating')" placeholder="1-5" min="1" max="5"
                    class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500" />
            <p *ngIf="touched.rating() && ratingError()" class="text-red-500 text-sm mt-1">{{ ratingError() }}</p>
        </div>
        <!-- Submit -->
        <button (click)="onPdfSubmit($event)"
                [disabled]="!isFormValid() || updating()"
                class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 disabled:opacity-50">
                {{ updating() ? 'Updating…' : 'Update PDF' }}
        </button>
    </form>
</div>
